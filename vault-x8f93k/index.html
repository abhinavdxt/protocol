<script>
(function () {
  // ---- 1) FIREBASE CONFIG ------------------------------------------------
  var FIREBASE_CONFIG = {
    apiKey: "AIzaSyDPUq6RuoNJk4C-ZyPwLYk6_UG2EG1m9Tk",
    authDomain: "protocol-abhinav.firebaseapp.com",
    projectId: "protocol-abhinav",
    storageBucket: "protocol-abhinav.firebasestorage.app",
    messagingSenderId: "108786974142",
    appId: "1:108786974142:web:2d512fffcb470d15968def"
  };

  // ---- 2) SYNC CODE ------------------------------------------------------
  // Make this long and private (like a password). Use the SAME value on
  // every device you want to sync. Anyone with this code can see your data.
  var SYNC_CODE = "93abf8c1-15e9-4672-8f65-4f40d51381b8";
  // ------------------------------------------------------------------------


  // ===== Nothing below here needs editing =================================
  var configured =
    FIREBASE_CONFIG.apiKey &&
    FIREBASE_CONFIG.apiKey.indexOf("PASTE") === -1 &&
    SYNC_CODE &&
    SYNC_CODE.indexOf("CHANGE-ME") === -1;

  var todayStr = function () { return new Date().toDateString(); };

  // Which checklist ticks consume which supplies, and how much per tick.
  // One tick can draw down several supplies at once (e.g. "Skincare AM").
  var CONSUMABLE_MAP = {
    shake:   [{ key: "creatine", amt: 5 }, { key: "whey", amt: 30 }],
    shake2:  [{ key: "whey", amt: 30 }],
    shake3:  [{ key: "whey", amt: 30 }],
    casein:  [{ key: "caseinprotein", amt: 30 }],
    skinam:  [{ key: "facewash", amt: 1 }, { key: "vitc", amt: 0.5 }, { key: "spf", amt: 1 }, { key: "eyeserum", amt: 0.3 }],
    skinpm:  [{ key: "facewash", amt: 1 }, { key: "niacinamide", amt: 0.5 }, { key: "moisturizer", amt: 1 }],
    beard:   [{ key: "beardoil", amt: 0.5 }],
    body:    [{ key: "biooil", amt: 3 }],
    minox:   [{ key: "minoxidil", amt: 1 }, { key: "scalpserum", amt: 0.5 }],
    shower:  [{ key: "shampoo", amt: 5 }, { key: "hairfiber", amt: 0.3 }, { key: "hairgel", amt: 2 }],
    w1:      [{ key: "ahabha", amt: 1 }],
    w2:      [{ key: "ahabha", amt: 1 }],
  };

  // Package sizes for tracked supplies (matches what's actually been bought).
  var SUPPLIES = {
    creatine:     { label: "Creatine Monohydrate",   size: 250, unit: "g" },
    whey:         { label: "Whey Protein",           size: 2000,unit: "g" },
    caseinprotein:{ label: "Casein Protein",         size: 1000,unit: "g" },
    facewash:     { label: "Face Wash",              size: 59,  unit: "ml" },
    vitc:         { label: "Vitamin C Serum",        size: 10,  unit: "ml" },
    spf:          { label: "Sunscreen",              size: 50,  unit: "g" },
    eyeserum:     { label: "Eye Cream (mCaffeine)",  size: 15,  unit: "g" },
    niacinamide:  { label: "Niacinamide Serum",      size: 60,  unit: "ml" },
    moisturizer:  { label: "Moisturizer",            size: 100, unit: "g" },
    beardoil:     { label: "Beard Oil",              size: 30,  unit: "ml" },
    biooil:       { label: "Bio-Oil / Cocoa Butter", size: 200, unit: "g" },
    minoxidil:    { label: "Minoxidil",              size: 60,  unit: "ml" },
    scalpserum:   { label: "Scalp Serum",            size: 100, unit: "ml" },
    shampoo:      { label: "Shampoo",                size: 200, unit: "ml" },
    hairfiber:    { label: "Hair Fiber",             size: 50,  unit: "g" },
    hairgel:      { label: "Hair Gel",               size: 150, unit: "ml" },
    ahabha:       { label: "AHA/BHA Exfoliant",      size: 30,  unit: "ml" },
  };
  window.__SUPPLIES = SUPPLIES;

  // Normalize a stored blob + reset daily checks when the date rolls over.
  // Before wiping yesterday's checks, roll them into the persistent usage log.
  function normalize(s) {
    if (!s) return { date: todayStr(), checks: {}, weekly: {}, usage: {}, opened: {} };
    var date = s.date || todayStr();
    var checks = s.checks || {};
    var weekly = s.weekly || {};
    var usage = s.usage || {};
    var opened = s.opened || {};
    if (date !== todayStr()) {
      var u = Object.assign({}, usage);
      Object.keys(checks).forEach(function (id) {
        if (!checks[id] || !CONSUMABLE_MAP[id]) return;
        CONSUMABLE_MAP[id].forEach(function (c) {
          var prev = u[c.key] || { totalUsed: 0 };
          u[c.key] = { totalUsed: prev.totalUsed + c.amt, lastDate: date };
        });
      });
      usage = u;
      date = todayStr(); checks = {}; // new day → reset dailies
    }
    return { date: date, checks: checks, weekly: weekly, usage: usage, opened: opened };
  }

  var state = { date: todayStr(), checks: {}, weekly: {}, usage: {}, opened: {} };
  var subs = [];
  var ready = false;
  var persist = function () {};

  function notify() { subs.slice().forEach(function (cb) { cb(state); }); }

  var store = {
    configured: configured,
    mode: configured ? "firebase" : "local",
    subscribe: function (cb) {
      subs.push(cb);
      if (ready) cb(state);
      return function () { subs = subs.filter(function (x) { return x !== cb; }); };
    },
    toggleDaily: function (id, data) {
      var c = Object.assign({}, state.checks);
      if (data !== undefined) {
        c[id] = data; // e.g. { done: true, amount: '45m', notes: 'good' }
      } else {
        c[id] = !c[id]; // legacy toggle
      }
      state = Object.assign({}, state, { checks: c });
      notify(); persist();
    },
    toggleWeekly: function (id) {
      var w = Object.assign({}, state.weekly); w[id] = !w[id];
      state = Object.assign({}, state, { weekly: w });
      notify(); persist();
    },
    markOpened: function (key) {
      var o = Object.assign({}, state.opened); o[key] = todayStr();
      var u = Object.assign({}, state.usage); u[key] = { totalUsed: 0, lastDate: todayStr() };
      state = Object.assign({}, state, { opened: o, usage: u });
      notify(); persist();
    }
  };
  window.__store = store;

  function startLocal() {
    store.mode = "local";
    var LS = "protocol-sync-state";
    try { state = normalize(JSON.parse(localStorage.getItem(LS) || "null")); }
    catch (e) { state = normalize(null); }
    persist = function () {
      try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {}
    };
    persist();
    ready = true;
    notify();
  }

  if (configured) {
    try {
      firebase.initializeApp(FIREBASE_CONFIG);
      var db = firebase.firestore();
      try { db.enablePersistence({ synchronizeTabs: true }); } catch (e) {} // offline support
      var ref = db.collection("protocol").doc(SYNC_CODE);

      persist = function () {
        ref.set(state, { merge: true }).catch(function (e) {
          console.error("Protocol: save failed", e);
        });
      };

      ref.onSnapshot(
        function (snap) {
          var raw = snap.exists ? snap.data() : null;
          var norm = normalize(raw);
          var needWrite = !raw || raw.date !== norm.date;
          state = norm;
          ready = true;
          notify();
          if (needWrite) persist(); // create doc / write the daily reset back
        },
        function (err) {
          console.error("Protocol: sync error", err);
          if (!ready) { ready = true; notify(); }
        }
      );

      // Safety net: if we never hear back (offline, bad config), don't hang on "Loading".
      setTimeout(function () { if (!ready) { ready = true; notify(); } }, 6000);
    } catch (e) {
      console.error("Protocol: Firebase init failed, falling back to local", e);
      startLocal();
    }
  } else {
    startLocal();
  }
})();
</script>

function getAdjustedChecklist(plan) {
  const adjusted = JSON.parse(JSON.stringify(dailyChecklist));
  if (!plan) return adjusted;

  const d = new Date();
  const istTime = d.getTime() + (5.5 * 60 * 60 * 1000) + (d.getTimezoneOffset() * 60000);
  const todayD = new Date(istTime);
  const y = todayD.getFullYear();
  const m = String(todayD.getMonth() + 1).padStart(2, "0");
  const dd = String(todayD.getDate()).padStart(2, "0");
  const todayStr = `${y}-${m}-${dd}`;

  const todayEvents = [];
  if (plan.exams) plan.exams.forEach(ex => { if (ex.date === todayStr) todayEvents.push(ex.time); });
  if (plan.classes) plan.classes.forEach(c => { if (c.date === todayStr) todayEvents.push(c.slot); });

  if (todayEvents.length === 0) return adjusted;

  function parseTime(t) {
    if (!t) return 9999;
    const start = t.split("–")[0].split("-")[0].trim().toLowerCase();
    let isPM = start.includes("pm");
    let isAM = start.includes("am");
    let clean = start.replace(/[^\d:]/g, "");
    if (!clean) return 9999;
    let parts = clean.split(":");
    let h = parseInt(parts[0], 10);
    let mins = parts[1] ? parseInt(parts[1], 10) : 0;
    
    if (!isPM && !isAM) {
      if (h >= 1 && h <= 7) isPM = true;
      if (h >= 8 && h <= 11) isAM = true;
      if (h === 12) isPM = true;
    }
    
    if (isPM && h !== 12) h += 12;
    if (isAM && h === 12) h = 0;
    return h * 60 + mins;
  }

  let earliestMorning = 9999;
  let hasEveningConflict = false;

  todayEvents.forEach(timeStr => {
    const startMins = parseTime(timeStr);
    if (startMins < 12 * 60 && startMins < earliestMorning) earliestMorning = startMins;
    if (startMins >= 17.5 * 60 && startMins <= 20.5 * 60) hasEveningConflict = true;
  });

  if (earliestMorning < 8.5 * 60) {
    const shiftMins = (8.5 * 60) - earliestMorning; 
    adjusted.forEach(group => {
      if (group.group === "Morning" || group.group === "Study & Afternoon") {
        group.items.forEach(item => {
           if (item.t && item.t !== "—" && item.t !== "") {
              const itemMins = parseTime(item.t);
              if (itemMins < 12 * 60) {
                 let newMins = itemMins - shiftMins;
                 if (newMins < 0) newMins += 24 * 60;
                 let h = Math.floor(newMins / 60);
                 let min = newMins % 60;
                 let formattedH = h > 12 ? h - 12 : (h === 0 ? 12 : h);
                 item.t = `${formattedH}:${String(min).padStart(2, "0")}`;
                 item.shifted = true;
              }
           }
        });
      }
    });
  }

  if (hasEveningConflict) {
    adjusted.forEach(group => {
      if (group.group === "Evening") {
        group.items.forEach(item => {
           if (["cardio", "dance", "shake3"].includes(item.id)) {
              const itemMins = parseTime(item.t);
              let newMins = itemMins - 120;
              let h = Math.floor(newMins / 60);
              let min = newMins % 60;
              let formattedH = h > 12 ? h - 12 : (h === 0 ? 12 : h);
              item.t = `${formattedH}:${String(min).padStart(2, "0")}`;
              item.shifted = true;
           }
        });
      }
    });
  }

  return adjusted;
}

        </div>
        <div style={{display:"flex",justifyContent:"center",gap:28,padding:"12px 0"}}>
          <div style={{textAlign:"center"}}><div style={{fontSize:36,fontWeight:800,color:c.ac,lineHeight:1}}>{daysLeft}</div><div style={{fontSize:9,color:c.dm,textTransform:"uppercase",letterSpacing:2,marginTop:2}}>Days Left</div></div>
          <div style={{textAlign:"center"}}><div style={{fontSize:36,fontWeight:800,lineHeight:1}}>86</div><div style={{fontSize:9,color:c.dm,textTransform:"uppercase",letterSpacing:2,marginTop:2}}>Target KG</div></div>
        </div>
      </div>

      {/* Tabs */}
      <div style={{display:"flex",gap:4,padding:"6px 12px",position:"sticky",top:0,background:c.bg,zIndex:10,borderBottom:`1px solid ${c.br}`}}>
        {[["today","✅ Today"],["workout","💪 Workout"],["shop","🛒 Shop"],["supplies","📦 Supplies"]].map(([k,l])=>(
          <div key={k} onClick={()=>setTab(k)} style={{flex:1,padding:"10px 4px",borderRadius:10,background:tab===k?c.ac:c.s1,color:tab===k?c.bg:c.dm,fontWeight:tab===k?700:500,fontSize:12,border:`1px solid ${tab===k?c.ac:c.br}`,cursor:"pointer",textAlign:"center"}}>{l}</div>
        ))}
      </div>

      {/* TODAY TAB */}
      {tab==="today"&&<div>
        <div style={{background:c.okBg,border:"1px solid rgba(101,207,160,0.25)",borderRadius:12,padding:"14px 16px",margin:"12px",textAlign:"center"}}>
          <div style={{fontSize:18,fontWeight:800,color:c.ok}}>{today.day} — {today.focus}</div>
          <div style={{fontSize:12,color:c.dm,marginTop:2}}>{today.tag}</div>
        </div>

        {/* EXAM / STUDY-BLOCK PLAN */}
        {plan&&(()=>{
          const du=(d)=>Math.ceil((new Date(d+"T00:00:00")-new Date(new Date().toDateString()))/86400000);
          const now=new Date();
          const todayISO=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
          const ex=(plan.exams||[]).map(e=>({...e,d:du(e.date)})).filter(e=>e.d>=0).sort((a,b)=>a.d-b.d);
          const block=ex.find(e=>e.blockDate===todayISO);
          if(!ex.length)return null;
          const n=ex[0];const urgent=n.d<=2;
          return(<div style={{margin:"12px 12px 0"}}>
            {block&&<div style={{background:"rgba(64,200,128,0.1)",border:"1px solid rgba(64,200,128,0.35)",borderRadius:12,padding:"11px 14px",marginBottom:8}}>
              <div style={{fontSize:11,fontWeight:700,color:c.ok,letterSpacing:0.5}}>📚 4-HOUR STUDY BLOCK TODAY</div>
              <div style={{fontSize:14,fontWeight:700,marginTop:3}}>{block.name}</div>
              <div style={{fontSize:12,color:c.tx,marginTop:1}}>{block.block}</div>
            </div>}
            <div style={{background:urgent?"rgba(240,80,80,0.1)":c.okBg,border:`1px solid ${urgent?"rgba(240,80,80,0.35)":"rgba(101,207,160,0.25)"}`,borderRadius:12,padding:"12px 14px"}}>
              <div style={{fontSize:10,fontWeight:700,letterSpacing:1.5,textTransform:"uppercase",color:urgent?"#f05050":c.ok}}>{n.d===0?"⚠ Exam today":n.d===1?"⚠ Exam tomorrow":`Next exam · ${n.d} days`}</div>
              <div style={{fontSize:16,fontWeight:800,marginTop:3}}>{n.name}</div>
              <div style={{fontSize:12,color:c.dm,marginTop:1}}>{n.dateLabel} · {n.time}</div>
              <div style={{fontSize:12,color:urgent?c.or:c.ok,marginTop:6,fontWeight:600}}>Reserve 4h: {n.block}</div>
            </div>
            {ex.length>1&&<div style={{padding:"8px 4px 0"}}>
              {ex.slice(1).map((e,i)=>(<div key={i} style={{display:"flex",justifyContent:"space-between",fontSize:11,color:c.dm,padding:"3px 2px"}}><span>{e.name}</span><span>{e.d}d · {e.dateLabel}</span></div>))}
            </div>}
            {plan.note&&<div style={{fontSize:11,color:c.or,marginTop:8,padding:"0 2px"}}>⚑ {plan.note}</div>}
            {plan.updated&&<div style={{fontSize:9,color:c.dm,textAlign:"right",marginTop:6,letterSpacing:0.5}}>synced {plan.updated}</div>}
          </div>);
        })()}

        <div style={{height:5,background:c.s2,borderRadius:3,margin:"12px 16px 0",overflow:"hidden"}}><div style={{height:"100%",background:c.ok,borderRadius:3,width:`${pct}%`,transition:"width 0.3s"}}/></div>
        <div style={{textAlign:"right",padding:"4px 16px 8px",fontSize:11,color:c.dm}}>{done}/{allI.length} — {pct}%</div>

        {activeChecklist.map(g=>(
          <div key={g.group} style={{padding:"0 12px",marginBottom:10}}>
            <div style={{background:c.s1,border:`1px solid ${c.br}`,borderRadius:12,overflow:"hidden"}}>
              <div style={{padding:"8px 14px",background:c.s2,fontSize:11,fontWeight:700,letterSpacing:1.5,color:c.dm,textTransform:"uppercase"}}>{g.group}</div>
              {g.items.map(item=>{
                const isW=item.id.startsWith("w");const on=isW?wChecks[item.id]:checks[item.id];
                return(
                  <div 
                    key={item.id} 
                    onClick={() => setTrackModal({item, isW, on, fn: isW ? togW : tog})}
                    style={{
                      display:"flex", alignItems:"center", padding:"12px 14px", borderBottom:`1px solid ${c.br}`,
                      cursor:"pointer", background:on ? c.okBg : c.badBg, transition:"all 0.2s"
                    }}
                  >
                    <div style={{width:20,height:20,borderRadius:6,border:`1px solid ${on ? c.ok : c.br}`,background:on ? c.ok : "transparent",marginRight:12,display:"flex",alignItems:"center",justifyContent:"center"}}>
                      {on && <span style={{color:c.bg,fontSize:14}}>✓</span>}
                    </div>
                    <div style={{flex:1}}>
                      <div style={{fontSize:13,color:on ? c.ok : c.tx,textDecoration:on?"line-through":"none",fontWeight:on?600:400}}>{item.label}</div>
                      {on && on.amount && <div style={{fontSize:10,color:c.ok,marginTop:2}}>{on.amount} {on.notes&&`— ${on.notes}`}</div>}
                    </div>
                    {item.t && <span style={item.shifted ? {fontSize:11, color:c.or, fontWeight:"bold", marginLeft:8, flexShrink:0} : {fontSize:11, color:c.dm, marginLeft:8, flexShrink:0}}>{item.t}</span>}
                  </div>
                );
              })}
            </div>
          </div>
        ))}
      </div>}

      {/* WORKOUT TAB */}
      {tab==="workout"&&<div>
        <div style={{background:c.acd,border:"1px solid rgba(184,240,53,0.25)",borderRadius:12,padding:"14px 16px",margin:"12px",textAlign:"center"}}>
          <div style={{fontSize:18,fontWeight:800,color:c.ac}}>{today.focus}</div>
          <div style={{fontSize:12,color:c.dm,marginTop:2}}>{isRest?"Rest day — still do knee + posture below":"Do these in order. Tap for form guide."}</div>
        </div>

        {!isRest&&<div style={{padding:"0 12px"}}>
          <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:1.5,color:c.dm,marginBottom:8}}>Today's Exercises</div>
          {todayEx.map((ex,i)=>{const k=`m${i}`;const o=openEx===k;return(
            <div key={k} style={{background:c.s1,border:`1px solid ${o?c.ac:c.br}`,borderRadius:12,marginBottom:8,overflow:"hidden"}}>
              <div onClick={()=>setOpenEx(o?null:k)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 14px",cursor:"pointer"}}>
                <div style={{flex:1}}><div style={{fontSize:14,fontWeight:600,marginBottom:1}}><span style={{color:c.ac,marginRight:6}}>{i+1}.</span>{ex.name}</div><div style={{fontSize:11,color:c.ac}}>{ex.target}</div></div>
                <div style={{display:"flex",alignItems:"center",gap:8}}><span style={{fontSize:12,fontWeight:700,color:c.ac}}>{ex.sets}</span><Chev open={o}/></div>
              </div>
              {ex.sub!=="—"&&<div style={{fontSize:11,color:c.or,padding:"0 14px 6px"}}>Gym equiv: {ex.sub}</div>}
              {o&&<div style={{padding:"10px 14px",background:c.s2,borderTop:`1px solid ${c.br}`,fontSize:13,lineHeight:1.6}}>{ex.how}</div>}
            </div>
          );})}
        </div>}

        {alwaysDo.map(sec=>(
          <div key={sec.group} style={{padding:"0 12px",marginTop:16}}>
            <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:1.5,color:c.dm,marginBottom:8}}>{sec.group}</div>
            {sec.items.map((ex,i)=>{const k=`${sec.group}-${i}`;const o=openEx===k;return(
              <div key={k} style={{background:c.s1,border:`1px solid ${o?c.ac:c.br}`,borderRadius:12,marginBottom:8,overflow:"hidden"}}>
                <div onClick={()=>setOpenEx(o?null:k)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 14px",cursor:"pointer"}}>
                  <div style={{flex:1,fontSize:14,fontWeight:600}}>{ex.name}</div>
                  <div style={{display:"flex",alignItems:"center",gap:8}}><span style={{fontSize:12,fontWeight:700,color:c.ac}}>{ex.sets}</span><Chev open={o}/></div>
                </div>
                {o&&<div style={{padding:"10px 14px",background:c.s2,borderTop:`1px solid ${c.br}`,fontSize:13,lineHeight:1.6}}>{ex.how}</div>}
              </div>
            );})}
          </div>
        ))}

        {isRest&&<div style={{textAlign:"center",padding:"40px 16px",color:c.dm}}>
          <div style={{fontSize:40,marginBottom:12}}>🛌</div>
          <div style={{fontSize:14}}>No lifting today. Stretch, walk, sleep well.</div>
          <div style={{fontSize:12,marginTop:8}}>Still do knee correction + posture above.</div>
        </div>}
      </div>}

      {/* SHOP TAB */}
      {tab==="shop"&&<div>
        <div style={{background:"rgba(64,200,128,0.08)",border:"1px solid rgba(64,200,128,0.25)",borderRadius:12,padding:"14px 16px",margin:"12px",textAlign:"center"}}>
          <div style={{fontSize:18,fontWeight:800,color:c.gn}}>₹7,000–10,000 total</div>
          <div style={{fontSize:12,color:c.dm,marginTop:2}}>One-time setup — recurring: whey + creatine ~₹2,200/mo</div>
        </div>
        {shoppingList.map(cat=>(
          <div key={cat.cat} style={{padding:"0 12px",marginBottom:12}}>
            <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:1.5,color:c.dm,marginBottom:8}}>{cat.cat}</div>
            {cat.items.map((item,i)=>{const k=`${cat.cat}-${i}`;const o=openShop===k;return(
              <div key={k} style={{background:c.s1,border:`1px solid ${o?c.ac:c.br}`,borderRadius:10,marginBottom:8,overflow:"hidden"}}>
                <div onClick={()=>setOpenShop(o?null:k)} style={{padding:"10px 14px",cursor:"pointer"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                    <div style={{fontSize:13,fontWeight:700}}>{item.n}</div>
                    <Chev open={o}/>
                  </div>
                  <div style={{fontSize:12,color:c.ac,marginTop:3}}>{item.pick}</div>
                  <div style={{fontSize:12,fontWeight:700,color:c.gn,marginTop:2}}>{item.p}</div>
                </div>
                {o&&<div style={{padding:"2px 14px 14px",background:c.s2,borderTop:`1px solid ${c.br}`}}>
                  <div style={{marginTop:10}}>
                    <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:1,color:c.gn}}>Goal — what we want out of it</div>
                    <div style={{fontSize:12,color:c.tx,marginTop:3,lineHeight:1.5}}>{item.goal}</div>
                  </div>
                  <div style={{marginTop:10}}>
                    <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:1,color:c.or}}>Why this at all</div>
                    <div style={{fontSize:12,color:c.tx,marginTop:3,lineHeight:1.5}}>{item.why}</div>
                  </div>
                  <div style={{marginTop:10}}>
                    <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:1,color:c.ac}}>Why this pick, not another</div>
                    <div style={{fontSize:12,color:c.tx,marginTop:3,lineHeight:1.5}}>{item.choice}</div>
                  </div>
                </div>}
              </div>
            );})}
          </div>
        ))}
      </div>}

      {/* SUPPLIES TAB */}
      {tab==="supplies"&&<div style={{padding:"0 12px"}}>
        <div style={{fontSize:11,color:c.dm,padding:"12px 2px",lineHeight:1.5}}>
          Estimates are built from your actual checklist ticks, not the label size alone. Tap "Mark as opened" the day you start a fresh bottle so the countdown has a clean starting point — new items need a few days of ticks before an estimate shows up.
        </div>
        {Object.keys(SUPPLIES).map(key=>{
          const sup = SUPPLIES[key];
          const u = (st && st.usage && st.usage[key]) || { totalUsed: 0 };
          const openedStr = st && st.opened && st.opened[key];
          let daysLeft=null, runOutDate=null, daysTracked=0;
          if (openedStr) {
            daysTracked = Math.max(1, Math.round((Date.now()-new Date(openedStr).getTime())/86400000));
            const perDay = u.totalUsed/daysTracked;
            const remaining = sup.size - u.totalUsed;
            if (perDay>0 && daysTracked>=3) {
              daysLeft = Math.max(0, Math.round(remaining/perDay));
              const d=new Date(); d.setDate(d.getDate()+daysLeft);
              runOutDate = d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
            }
          }
          return (
            <div key={key} style={{background:c.s1,border:`1px solid ${c.br}`,borderRadius:10,padding:"12px 14px",marginBottom:8}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div style={{fontSize:13,fontWeight:700}}>{sup.label}</div>
                <div style={{fontSize:11,color:c.dm}}>{sup.size}{sup.unit} pack</div>
              </div>
              {!openedStr && <div style={{marginTop:8,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div style={{fontSize:11,color:c.dm}}>Not tracking yet</div>
                <div onClick={()=>window.__store.markOpened(key)} style={{fontSize:11,fontWeight:700,color:c.bg,background:c.ac,padding:"6px 10px",borderRadius:8,cursor:"pointer"}}>Mark as opened</div>
              </div>}
              {openedStr && daysLeft===null && <div style={{marginTop:8,fontSize:12,color:c.dm}}>Tracking since {openedStr} — building up enough data ({daysTracked} day{daysTracked===1?"":"s"} so far).</div>}
              {openedStr && daysLeft!==null && <div style={{marginTop:8}}>
                <div style={{fontSize:13,fontWeight:700,color:daysLeft<=7?c.rd:daysLeft<=14?c.or:c.gn}}>~{daysLeft} day{daysLeft===1?"":"s"} left</div>
                <div style={{fontSize:11,color:c.dm,marginTop:2}}>Runs out around {runOutDate} at your current pace · opened {openedStr}</div>
                <div onClick={()=>window.__store.markOpened(key)} style={{fontSize:10,color:c.ac,marginTop:6,cursor:"pointer",textDecoration:"underline"}}>Just opened a new one? Reset tracking</div>
              </div>}
            </div>
          );
        })}
      </div>}

      {/* TRACKING MODAL */}
      {trackModal&&(()=>{
        const {item, fn, on} = trackModal;
        const initialAmount = on && on.amount ? on.amount : "";
        const initialNotes = on && on.notes ? on.notes : "";
        return(
          <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.8)",zIndex:999,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
            <div style={{background:c.s2,width:"100%",maxWidth:500,borderTopLeftRadius:20,borderTopRightRadius:20,padding:"20px",borderTop:`1px solid ${c.br}`}}>
              <div style={{fontSize:12,color:c.ac,letterSpacing:1,textTransform:"uppercase",fontWeight:700,marginBottom:4}}>Log Progress</div>
              <div style={{fontSize:18,fontWeight:800,marginBottom:16}}>{item.label}</div>
              
              <div style={{marginBottom:12}}>
                <div style={{fontSize:11,color:c.dm,marginBottom:4,textTransform:"uppercase"}}>Amount / Duration (Optional)</div>
                <input id="track-amount" type="text" defaultValue={initialAmount} placeholder="e.g. 45 mins, 10 pages" style={{width:"100%",background:c.bg,border:`1px solid ${c.br}`,color:c.tx,padding:"12px",borderRadius:8,fontSize:14}} />
              </div>
              <div style={{marginBottom:20}}>
                <div style={{fontSize:11,color:c.dm,marginBottom:4,textTransform:"uppercase"}}>Notes (Optional)</div>
                <input id="track-notes" type="text" defaultValue={initialNotes} placeholder="e.g. Felt sluggish, pushed through" style={{width:"100%",background:c.bg,border:`1px solid ${c.br}`,color:c.tx,padding:"12px",borderRadius:8,fontSize:14}} />
              </div>
              
              <div style={{display:"flex",gap:12}}>
                <button onClick={()=>setTrackModal(null)} style={{flex:1,padding:"14px",background:c.s1,border:`1px solid ${c.br}`,color:c.tx,borderRadius:8,fontSize:14,fontWeight:700,cursor:"pointer"}}>Cancel</button>
                <button onClick={()=>{
                  const amt = document.getElementById("track-amount").value;
                  const notes = document.getElementById("track-notes").value;
                  if (!amt && !notes && !on) {
                    fn(item.id); // legacy toggle
                  } else if (on && !amt && !notes) {
                    fn(item.id, false); // uncheck
                  } else {
                    fn(item.id, { done: true, amount: amt, notes: notes });
                  }
                  setTrackModal(null);
                }} style={{flex:2,padding:"14px",background:c.ac,border:"none",color:c.bg,borderRadius:8,fontSize:14,fontWeight:800,cursor:"pointer"}}>{on ? "Update Log" : "Mark Done"}</button>
                {on && <button onClick={()=>{ fn(item.id, false); setTrackModal(null); }} style={{padding:"14px",background:c.rd,border:"none",color:c.bg,borderRadius:8,fontSize:14,fontWeight:800,cursor:"pointer"}}>Uncheck</button>}
              </div>
            </div>
          </div>
        );
      })()}

      <div style={{textAlign:"center",padding:"24px 0",fontSize:10,color:c.dm,letterSpacing:2,textTransform:"uppercase"}}>
        100.4 → 86 — <span style={{color:c.ac}}>The Protocol</span>
        <div style={{marginTop:8,letterSpacing:1}}><a href="schedule.html" style={{color:c.gn,textDecoration:"none"}}>Partner Timetable View →</a></div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

<script>
(function () {
  try {
    var src = document.getElementById("app-src").textContent;
    var out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
    (0, eval)(out);
  } catch (e) {
    console.error("Protocol: app failed to compile/run", e);
    document.getElementById("root").innerHTML =
      '<div style="color:#f05050;font-family:system-ui;padding:24px;font-size:14px;line-height:1.5">App failed to load:<br>' +
      (e && e.message ? e.message : e) + '</div>';
  }
})();
</script>
</body>
