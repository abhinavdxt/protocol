<!-- ============================================================= -->
<!--  SYNC ENGINE — SAME CONFIG & CODE AS index.html               -->
<!--  Paste FIREBASE_CONFIG & SYNC_CODE to sync across devices.    -->
<!-- ============================================================= -->
<script>
(function () {
  var FIREBASE_CONFIG = {
    apiKey:        "PASTE_YOUR_API_KEY",
    authDomain:    "PASTE_YOUR_PROJECT.firebaseapp.com",
    projectId:     "PASTE_YOUR_PROJECT_ID"
  };

  var SYNC_CODE = "CHANGE-ME-to-a-long-private-code";

  var configured =
    FIREBASE_CONFIG.apiKey &&
    FIREBASE_CONFIG.apiKey.indexOf("PASTE") === -1 &&
    SYNC_CODE &&
    SYNC_CODE.indexOf("CHANGE-ME") === -1;

  var todayStr = function () { return new Date().toDateString(); };

  function normalize(s) {
    if (!s) return { date: todayStr(), checks: {}, weekly: {}, meals: {} };
    var date = s.date || todayStr();
    var checks = s.checks || {};
    var weekly = s.weekly || {};
    var meals = s.meals || {};
    if (date !== todayStr()) { date = todayStr(); checks = {}; meals = {}; }
    return { date: date, checks: checks, weekly: weekly, meals: meals };
  }

  var state = { date: todayStr(), checks: {}, weekly: {}, meals: {} };
  var subs = [];
  var ready = false;
  var persist = function () {};

  function notify() { subs.slice().forEach(function (cb) { cb(state); }); }

  var store = {
    configured: configured,
    mode: configured ? "firebase" : "local",
    subscribe: function (cb) {
      subs.push(cb);
      if (ready) cb(state);
      return function () { subs = subs.filter(function (x) { return x !== cb; }); };
    },
    toggleDaily: function (id) {
      var c = Object.assign({}, state.checks); c[id] = !c[id];
      state = { date: state.date, checks: c, weekly: state.weekly, meals: state.meals };
      notify(); persist();
    },
    toggleMeal: function (id) {
      var m = Object.assign({}, state.meals); m[id] = !m[id];
      state = { date: state.date, checks: state.checks, weekly: state.weekly, meals: m };
      notify(); persist();
    }
  };
  window.__store = store;

  function startLocal() {
    store.mode = "local";
    var LS = "protocol-sync-state";
    try { state = normalize(JSON.parse(localStorage.getItem(LS) || "null")); }
    catch (e) { state = normalize(null); }
    persist = function () {
      try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {}
    };
    persist();
    ready = true;
    notify();
  }

  if (configured) {
    try {
      firebase.initializeApp(FIREBASE_CONFIG);
      var db = firebase.firestore();
      try { db.enablePersistence({ synchronizeTabs: true }); } catch (e) {}
      var ref = db.collection("protocol").doc(SYNC_CODE);

      persist = function () {
        ref.set(state, { merge: true }).catch(function (e) {
          console.error("Protocol Schedule: save failed", e);
        });
      };

      ref.onSnapshot(
        function (snap) {
          var raw = snap.exists ? snap.data() : null;
          var norm = normalize(raw);
          var needWrite = !raw || raw.date !== norm.date;
          state = norm;
          ready = true;
          notify();
          if (needWrite) persist();
        },
        function (err) {
          console.error("Protocol Schedule: sync error", err);
          if (!ready) { ready = true; notify(); }
        }
      );

      setTimeout(function () { if (!ready) { ready = true; notify(); } }, 6000);
    } catch (e) {
      console.error("Protocol Schedule: Firebase init failed", e);
      startLocal();
    }
  } else {
    startLocal();
  }
})();
</script>

<script type="text/babel" data-presets="react,stage-3">
const { useState, useEffect, useMemo } = React;

// Color Design System (Dark sleek palette)
const c = {
  bg: "#06060a",
  s1: "#111115",
  s2: "#19191e",
  s3: "#23232a",
  br: "rgba(255,255,255,0.08)",
  tx: "#f4f1ec",
  dm: "#8e8b88",
  ac: "#d4f244", // electric lime accent
  acd: "rgba(212,242,68,0.12)",
  gn: "#65cfa0",
  gnd: "rgba(101,207,160,0.12)",
  or: "#f0b84a",
  ord: "rgba(240,184,74,0.12)",
  rd: "#f09595",
  rdd: "rgba(240,149,149,0.12)",
  cy: "#70aee8",
  cyd: "rgba(112,174,232,0.12)",
};

// Daily Timetable Checklist (Zero intimate health/weight metrics)
const timetableBlocks = [
  {
    group: "☀️ Morning Routine",
    items: [
      { id: "wimhof_am", time: "6:00 AM", label: "Wim Hof Breathing", desc: "3 rounds for oxygenation & alertness" },
      { id: "bball", time: "6:15 AM", label: "Basketball Session", desc: "1-hour court cardio & drills" },
      { id: "lift", time: "7:15 AM", label: "Morning Training", desc: "Daily strength workout time block" },
      { id: "knee", time: "7:45 AM", label: "Knee Stability Work", desc: "Clamshells & bridge activation" },
      { id: "shower", time: "7:50 AM", label: "Shower & Ready", desc: "Morning refresh & prep" },
      { id: "meal1", time: "8:10 AM", label: "Breakfast (Meal 1)", desc: "Eggs, high-protein & fresh veggies" },
    ]
  },
  {
    group: "📖 Academic & Study Blocks (XLRI Term IV)",
    items: [
      { id: "nback", time: "8:15 AM", label: "Dual N-Back Session", desc: "20-minute focus & cognitive drill" },
      { id: "study1", time: "8:35 AM", label: "Deep Study Block 1", desc: "Core coursework & hardest readings" },
      { id: "shake", time: "12:30 PM", label: "Midday Fuel", desc: "Protein shake + hydration break" },
      { id: "math", time: "12:45 PM", label: "Mental Math Drill", desc: "5-minute quantitative calculation drill" },
      { id: "study2", time: "1:00 PM", label: "Study Block 2", desc: "Anki cards, cases & lecture notes" },
      { id: "water3", time: "3:00 PM", label: "Hydration Milestone", desc: "3 Liters water goal completed ✓" },
    ]
  },
  {
    group: "🌙 Evening Routine",
    items: [
      { id: "meal2", time: "4:00 PM", label: "Dinner Prep / Meal 2", desc: "Lean protein, salad & dal" },
      { id: "study3", time: "4:30 PM", label: "Study Block 3", desc: "Exam practice problems & synthesis" },
      { id: "cardio", time: "7:00 PM", label: "Evening Cardio Block", desc: "30-minute cycling or conditioning" },
      { id: "meal3", time: "8:00 PM", label: "Light Evening Snack", desc: "Greek yogurt / protein snack" },
      { id: "wind", time: "9:30 PM", label: "Wind Down & Plan", desc: "Prepare schedule for tomorrow" },
    ]
  }
];

// Daily Calorie & Nutrition Schedule (Total ~1,900 kcal target)
const mealSchedule = [
  { id: "meal_bf", time: "8:10 AM", name: "Breakfast (Meal 1)", calories: 500, desc: "Eggs + Chicken/Paneer + Fresh Salad & Veggies" },
  { id: "meal_sh", time: "12:30 PM", name: "Midday Protein Fuel", calories: 200, desc: "Whey Protein Shake + Creatine + Electrolytes" },
  { id: "meal_dn", time: "4:00 PM", name: "Afternoon Meal (Meal 2)", calories: 600, desc: "Chicken / Fish / Paneer + Mixed Green Salad + Dal" },
  { id: "meal_ev", time: "8:00 PM", name: "Evening Snack (Meal 3)", calories: 400, desc: "Greek Yogurt / Cottage Cheese bowl" },
  { id: "meal_ex", time: "Flexible", name: "Buffer / Fruit / Coffee", calories: 200, desc: "Black coffee, fruit snack, or study energy buffer" },
];

const DAILY_CALORIE_TARGET = 1900;

function App() {
  const [tab, setTab] = useState("timetable");
  const [st, setSt] = useState(null);
  const [plan, setPlan] = useState(null);

  useEffect(() => window.__store.subscribe(setSt), []);

  // Fetch real-time exam plan generated twice-daily by build-plan.js
  useEffect(() => {
    fetch("plan.json", { cache: "no-store" })
      .then((r) => (r.ok ? r.json() : null))
      .then(setPlan)
      .catch(() => {});
  }, []);

  if (!st) {
    return (
      <div style={{ background: c.bg, color: c.dm, minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "Syne, sans-serif" }}>
        Loading Timetable…
      </div>
    );
  }

  const checks = st.checks || {};
  const mealsChecked = st.meals || {};
  const synced = window.__store.mode === "firebase";

  const toggleDaily = (id) => window.__store.toggleDaily(id);
  const toggleMeal = (id) => window.__store.toggleMeal(id);

  // Timetable progress
  const allItems = timetableBlocks.flatMap((g) => g.items);
  const doneCount = allItems.filter((i) => checks[i.id]).length;
  const progressPct = Math.round((doneCount / allItems.length) * 100);

  // Calorie calculations
  const consumedCals = mealSchedule.reduce((acc, m) => (mealsChecked[m.id] ? acc + m.calories : acc), 0);
  const caloriePct = Math.min(100, Math.round((consumedCals / DAILY_CALORIE_TARGET) * 100));

  // Exam helpers
  const todayISO = new Date().toISOString().slice(0, 10);
  const examsList = plan ? plan.exams || [] : [];
  const activeStudyBlock = examsList.find((e) => e.blockDate === todayISO);

  return (
    <div style={{ background: c.bg, color: c.tx, minHeight: "100vh", maxWidth: 540, margin: "0 auto", paddingBottom: 80, position: "relative" }}>
      {/* HEADER */}
      <div style={{ padding: "24px 20px 14px", borderBottom: `1px solid ${c.br}`, background: "rgba(6,6,10,0.8)", backdropFilter: "blur(14px)", position: "sticky", top: 0, zIndex: 30 }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <div>
            <div style={{ fontSize: 10, fontFamily: "DM Mono, monospace", color: c.ac, letterSpacing: 1.5, textTransform: "uppercase", fontWeight: 500 }}>
              XLRI Term IV · Partner View
            </div>
            <div style={{ fontSize: 22, fontFamily: "Syne, sans-serif", fontWeight: 800, letterSpacing: -0.5, marginTop: 2 }}>
              THE PROTOCOL
            </div>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 6, background: c.s1, border: `1px solid ${c.br}`, padding: "5px 10px", borderRadius: 20 }}>
            <span style={{ width: 6, height: 6, borderRadius: "50%", background: synced ? c.gn : c.or }} className={synced ? "animate-pulse" : ""} />
            <span style={{ fontSize: 10, fontFamily: "DM Mono, monospace", color: c.dm }}>
              {synced ? "Live Sync" : "Local Standalone"}
            </span>
          </div>
        </div>

        {/* QUICK STAT BAR */}
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginTop: 16 }}>
          <div style={{ background: c.s1, border: `1px solid ${c.br}`, borderRadius: 12, padding: "10px 12px" }}>
            <div style={{ fontSize: 10, color: c.dm, fontFamily: "DM Mono, monospace", textTransform: "uppercase" }}>Timetable Progress</div>
            <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginTop: 4 }}>
              <span style={{ fontSize: 20, fontWeight: 700, fontFamily: "Syne, sans-serif" }}>{doneCount}/{allItems.length}</span>
              <span style={{ fontSize: 13, fontWeight: 600, color: c.ac, fontFamily: "DM Mono, monospace" }}>{progressPct}%</span>
            </div>
            <div style={{ height: 4, background: c.s3, borderRadius: 2, marginTop: 6, overflow: "hidden" }}>
              <div style={{ height: "100%", width: `${progressPct}%`, background: c.ac, borderRadius: 2, transition: "width 0.3s ease" }} />
            </div>
          </div>

          <div style={{ background: c.s1, border: `1px solid ${c.br}`, borderRadius: 12, padding: "10px 12px" }}>
            <div style={{ fontSize: 10, color: c.dm, fontFamily: "DM Mono, monospace", textTransform: "uppercase" }}>Daily Calorie Target</div>
            <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginTop: 4 }}>
              <span style={{ fontSize: 20, fontWeight: 700, fontFamily: "Syne, sans-serif" }}>{consumedCals} <span style={{ fontSize: 12, color: c.dm, fontWeight: 400 }}>/ {DAILY_CALORIE_TARGET}</span></span>
              <span style={{ fontSize: 11, fontWeight: 600, color: c.gn, fontFamily: "DM Mono, monospace" }}>kcal</span>
            </div>
            <div style={{ height: 4, background: c.s3, borderRadius: 2, marginTop: 6, overflow: "hidden" }}>
              <div style={{ height: "100%", width: `${caloriePct}%`, background: `linear-gradient(90deg, ${c.ac}, ${c.gn})`, borderRadius: 2, transition: "width 0.3s ease" }} />
            </div>
          </div>
        </div>

        {/* NAV TABS */}
        <div style={{ display: "flex", gap: 6, marginTop: 14 }}>
          {[
            ["timetable", "📅 Timetable"],
            ["calories", "🥗 Daily Calories"],
            ["exams", "📚 Exam Plan"],
          ].map(([k, label]) => {
            const active = tab === k;
            return (
              <button
                key={k}
                onClick={() => setTab(k)}
                style={{
                  flex: 1,
                  padding: "9px 6px",
                  borderRadius: 10,
                  border: `1px solid ${active ? c.ac : c.br}`,
                  background: active ? c.acd : c.s1,
                  color: active ? c.ac : c.dm,
                  fontFamily: "Syne, sans-serif",
                  fontSize: 12,
                  fontWeight: active ? 700 : 600,
                  cursor: "pointer",
                  transition: "all 0.2s ease",
                }}
              >
                {label}
              </button>
            );
          })}
        </div>
      </div>

      {/* CONTENT AREA */}
      <div style={{ padding: "16px 18px" }}>
        {/* TAB 1: TIMETABLE & ROUTINE */}
        {tab === "timetable" && (
          <div className="animate-fade">
            {/* EXAM / STUDY BLOCK ALERT IF ACTIVE TODAY */}
            {activeStudyBlock && (
              <div style={{ background: c.ord, border: `1px solid rgba(240,184,74,0.4)`, borderRadius: 14, padding: "14px 16px", marginBottom: 16 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8, color: c.or, fontSize: 11, fontFamily: "DM Mono, monospace", fontWeight: 700, letterSpacing: 0.5 }}>
                  <span>⚠️ UPCOMING EXAM STUDY BLOCK</span>
                </div>
                <div style={{ fontSize: 16, fontFamily: "Syne, sans-serif", fontWeight: 800, marginTop: 4 }}>
                  {activeStudyBlock.name}
                </div>
                <div style={{ fontSize: 12, color: c.tx, marginTop: 2 }}>
                  <strong>Reserved Study Block:</strong> {activeStudyBlock.block}
                </div>
              </div>
            )}

            {timetableBlocks.map((group, gi) => (
              <div key={gi} style={{ marginBottom: 22 }}>
                <div style={{ fontSize: 12, fontFamily: "Syne, sans-serif", fontWeight: 700, color: c.dm, letterSpacing: 0.5, marginBottom: 10, display: "flex", alignItems: "center", gap: 6 }}>
                  <span>{group.group}</span>
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {group.items.map((item) => {
                    const isDone = !!checks[item.id];
                    return (
                      <div
                        key={item.id}
                        onClick={() => toggleDaily(item.id)}
                        style={{
                          display: "flex",
                          alignItems: "center",
                          justifyContent: "space-between",
                          padding: "13px 15px",
                          borderRadius: 12,
                          background: isDone ? "rgba(101,207,160,0.06)" : c.s1,
                          border: `1px solid ${isDone ? "rgba(101,207,160,0.3)" : c.br}`,
                          cursor: "pointer",
                          transition: "all 0.15s ease",
                        }}
                      >
                        <div style={{ display: "flex", alignItems: "center", gap: 14, minWidth: 0, flex: 1 }}>
                          <div
                            style={{
                              width: 22,
                              height: 22,
                              borderRadius: 6,
                              border: `1.5px solid ${isDone ? c.gn : c.dm}`,
                              background: isDone ? c.gn : "transparent",
                              display: "flex",
                              alignItems: "center",
                              justifyContent: "center",
                              flexShrink: 0,
                              color: c.bg,
                              fontSize: 13,
                              fontWeight: 800,
                            }}
                          >
                            {isDone && "✓"}
                          </div>
                          <div style={{ minWidth: 0 }}>
                            <div style={{ fontSize: 14, fontWeight: 600, color: isDone ? c.gn : c.tx, textDecoration: isDone ? "line-through" : "none" }}>
                              {item.label}
                            </div>
                            <div style={{ fontSize: 11, color: c.dm, marginTop: 2 }}>
                              {item.desc}
                            </div>
                          </div>
                        </div>
                        <div style={{ fontSize: 11, fontFamily: "DM Mono, monospace", color: isDone ? c.gn : c.ac, background: isDone ? c.gnd : c.acd, padding: "3px 8px", borderRadius: 6, flexShrink: 0, marginLeft: 10 }}>
                          {item.time}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
        )}

        {/* TAB 2: DAILY CALORIES & MEALS */}
        {tab === "calories" && (
          <div className="animate-fade">
            <div style={{ background: c.s1, border: `1px solid ${c.br}`, borderRadius: 14, padding: "16px 18px", marginBottom: 18 }}>
              <div style={{ fontSize: 11, fontFamily: "DM Mono, monospace", color: c.ac, textTransform: "uppercase", letterSpacing: 1 }}>
                Nutrition & Fuel Breakdown
              </div>
              <div style={{ fontSize: 18, fontFamily: "Syne, sans-serif", fontWeight: 800, marginTop: 4 }}>
                Daily Calorie Target: {DAILY_CALORIE_TARGET} kcal
              </div>
              <div style={{ fontSize: 12, color: c.dm, marginTop: 4, lineHeight: 1.5 }}>
                Structured meal timing without body measurement tracking. Check off meals as they are completed to monitor daily intake.
              </div>

              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: 14, paddingTop: 14, borderTop: `1px solid ${c.br}` }}>
                <div>
                  <div style={{ fontSize: 11, color: c.dm }}>Total Logged</div>
                  <div style={{ fontSize: 22, fontFamily: "Syne, sans-serif", fontWeight: 800, color: c.gn }}>
                    {consumedCals} <span style={{ fontSize: 13, color: c.dm }}>kcal</span>
                  </div>
                </div>
                <div style={{ textAlign: "right" }}>
                  <div style={{ fontSize: 11, color: c.dm }}>Remaining</div>
                  <div style={{ fontSize: 22, fontFamily: "Syne, sans-serif", fontWeight: 800, color: consumedCals >= DAILY_CALORIE_TARGET ? c.ac : c.tx }}>
                    {Math.max(0, DAILY_CALORIE_TARGET - consumedCals)} <span style={{ fontSize: 13, color: c.dm }}>kcal</span>
                  </div>
                </div>
              </div>
            </div>

            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {mealSchedule.map((meal) => {
                const isDone = !!mealsChecked[meal.id];
                return (
                  <div
                    key={meal.id}
                    onClick={() => toggleMeal(meal.id)}
                    style={{
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "space-between",
                      padding: "14px 16px",
                      borderRadius: 12,
                      background: isDone ? "rgba(101,207,160,0.06)" : c.s1,
                      border: `1px solid ${isDone ? "rgba(101,207,160,0.3)" : c.br}`,
                      cursor: "pointer",
                      transition: "all 0.15s ease",
                    }}
                  >
                    <div style={{ display: "flex", alignItems: "center", gap: 14, minWidth: 0, flex: 1 }}>
                      <div
                        style={{
                          width: 22,
                          height: 22,
                          borderRadius: 6,
                          border: `1.5px solid ${isDone ? c.gn : c.dm}`,
                          background: isDone ? c.gn : "transparent",
                          display: "flex",
                          alignItems: "center",
                          justifyContent: "center",
                          flexShrink: 0,
                          color: c.bg,
                          fontSize: 13,
                          fontWeight: 800,
                        }}
                      >
                        {isDone && "✓"}
                      </div>
                      <div style={{ minWidth: 0 }}>
                        <div style={{ fontSize: 15, fontWeight: 600, color: isDone ? c.gn : c.tx }}>
                          {meal.name}
                        </div>
                        <div style={{ fontSize: 11, color: c.dm, marginTop: 2 }}>
                          {meal.desc}
                        </div>
                      </div>
                    </div>

                    <div style={{ textAlign: "right", flexShrink: 0, marginLeft: 12 }}>
                      <div style={{ fontSize: 14, fontFamily: "Syne, sans-serif", fontWeight: 700, color: isDone ? c.gn : c.ac }}>
                        {meal.calories} kcal
                      </div>
                      <div style={{ fontSize: 10, fontFamily: "DM Mono, monospace", color: c.dm, marginTop: 2 }}>
                        {meal.time}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* TAB 3: EXAM SCHEDULE & STUDY BLOCKS */}
        {tab === "exams" && (
          <div className="animate-fade">
            <div style={{ background: c.cyd, border: `1px solid rgba(112,174,232,0.3)`, borderRadius: 14, padding: "16px 18px", marginBottom: 18 }}>
              <div style={{ fontSize: 11, fontFamily: "DM Mono, monospace", color: c.cy, textTransform: "uppercase", letterSpacing: 1 }}>
                XLRI Term IV · Enrolled Courses
              </div>
              <div style={{ fontSize: 18, fontFamily: "Syne, sans-serif", fontWeight: 800, marginTop: 4 }}>
                Automated Exam & Study Block Feed
              </div>
              <div style={{ fontSize: 12, color: c.dm, marginTop: 4 }}>
                Automatically refreshed twice daily from Command Centre (`plan.json`). Includes mandatory 4-hour study blocks reserved the evening before each test.
              </div>
              {plan && plan.updated && (
                <div style={{ fontSize: 10, color: c.cy, fontFamily: "DM Mono, monospace", marginTop: 8 }}>
                  Last Synced: {plan.updated}
                </div>
              )}
            </div>

            <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
              {examsList.length === 0 ? (
                <div style={{ textAlign: "center", padding: "40px 20px", background: c.s1, borderRadius: 12, color: c.dm }}>
                  No upcoming exams listed in `plan.json` right now.
                </div>
              ) : (
                examsList.map((ex, idx) => (
                  <div key={idx} style={{ background: c.s1, border: `1px solid ${c.br}`, borderRadius: 14, padding: "16px 18px" }}>
                    <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 12 }}>
                      <div>
                        <span style={{ fontSize: 10, fontFamily: "DM Mono, monospace", background: c.s3, color: c.ac, padding: "3px 8px", borderRadius: 6, fontWeight: 500 }}>
                          {ex.type || "Exam"}
                        </span>
                        <div style={{ fontSize: 16, fontFamily: "Syne, sans-serif", fontWeight: 800, marginTop: 6, color: c.tx }}>
                          {ex.name}
                        </div>
                        <div style={{ fontSize: 12, color: c.dm, marginTop: 3 }}>
                          📅 <strong>{ex.dateLabel}</strong> · {ex.time}
                        </div>
                      </div>
                    </div>

                    <div style={{ marginTop: 12, paddingTop: 12, borderTop: `1px dashed ${c.br}`, display: "flex", alignItems: "center", gap: 8 }}>
                      <span style={{ fontSize: 14 }}>📚</span>
                      <div>
                        <div style={{ fontSize: 11, color: c.or, fontWeight: 700, fontFamily: "DM Mono, monospace" }}>
                          MANDATORY STUDY BLOCK
                        </div>
                        <div style={{ fontSize: 12, color: c.tx, marginTop: 1 }}>
                          {ex.block}
                        </div>
                      </div>
                    </div>
                  </div>
                ))
              )}
            </div>
          </div>
        )}
      </div>

      {/* FOOTER */}
      <div style={{ textAlign: "center", padding: "20px 16px", fontSize: 11, color: c.dm, borderTop: `1px solid ${c.br}`, marginTop: 24 }}>
        The Protocol · Shared Timetable & Calorie Tracker · Realtime Sync
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
